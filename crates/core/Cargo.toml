[package]
name = "itmo-labels-core"
version.workspace = true
edition.workspace = true

[dependencies]
ab_glyph = "0.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
nusb = "0.2.9"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.191"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading", "Win32_Security", "Win32_Graphics_Printing"] }
