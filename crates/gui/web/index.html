<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>ITMO Labels</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #1b1b1b; }
    canvas { display: block; position: absolute; inset: 0; width: 100%; height: 100%; }
    #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
               font: 16px Helvetica, Arial, sans-serif; color: #aaa; }
  </style>
</head>
<body>
  <canvas id="app"></canvas>
  <div id="loading">Loading…</div>
  <script type="module">
    import init from "./itmo-labels.js";
    init().catch((e) => { document.getElementById("loading").textContent = "Failed to start: " + e; });
  </script>
</body>
</html>
