[package]
name = "itmo-labels"
version.workspace = true
edition.workspace = true

[dependencies]
eframe = { version = "0.35.0", default-features = false, features = ["glow", "wayland", "x11"] }
itmo-labels-core.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sys-locale = "0.3.2"
toml = "1.1.8"
web-time = "1.1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
dirs = "7.0.0"
httparse = "1.10.1"
if-addrs = { version = "0.15.0", default-features = false }
qrcode = { version = "0.14.1", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
ehttp = "0.7.2"
sys-locale = { version = "0.3.2", features = ["js"] }
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.106", features = ["Window", "Document", "HtmlCanvasElement", "Storage", "Element"] }
