# Pull requests: clippy + tests and a release build on Linux x86_64 only.
# Pushes to main: clippy + tests on Linux, macOS and Windows, then release builds for all
# targets, uploaded as workflow artifacts.
# Both also build the web version once (for server mode) and embed it in every build. A pushed tag v* also publishes a GitHub Release
# with the archives.

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-22.04"]') || fromJSON('["ubuntu-22.04", "macos-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  # The web version of the app, built once and embedded by every native build for server mode.
  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: web
      - run: cargo clippy -p itmo-labels --target wasm32-unknown-unknown --locked -- -D warnings
      - run: scripts/build-web.sh
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: crates/gui/web/dist
          if-no-files-found: error

  build:
    name: Build (${{ matrix.name }})
    needs: [check, web]
    strategy:
      fail-fast: false
      # Linux is built on the oldest supported Ubuntu so the binaries run on older glibc too.
      matrix:
        include: >-
          ${{ fromJSON(github.event_name == 'pull_request' && '[
            {"name": "linux-x86_64", "os": "ubuntu-22.04", "target": "x86_64-unknown-linux-gnu"}
          ]' || '[
            {"name": "linux-x86_64", "os": "ubuntu-22.04", "target": "x86_64-unknown-linux-gnu"},
            {"name": "linux-aarch64", "os": "ubuntu-22.04", "target": "aarch64-unknown-linux-gnu", "cross_linker": "aarch64-linux-gnu-gcc"},
            {"name": "windows-x86_64", "os": "windows-latest", "target": "x86_64-pc-windows-msvc"},
            {"name": "windows-arm64", "os": "windows-latest", "target": "aarch64-pc-windows-msvc"},
            {"name": "macos-universal", "os": "macos-latest", "target": "aarch64-apple-darwin,x86_64-apple-darwin"}
          ]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: crates/gui/web/dist

      - name: Package name
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="$GITHUB_REF_NAME"; else version="${GITHUB_SHA::7}"; fi
          echo "PKG=itmo-labels-$version-${{ matrix.name }}" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      # eframe loads X11, Wayland and GL with dlopen, so cross-linking needs only a C toolchain.
      - name: Install cross linker
        if: matrix.cross_linker
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=${{ matrix.cross_linker }}" >> "$GITHUB_ENV"

      - name: Build and package (macOS)
        if: runner.os == 'macOS'
        run: |
          scripts/macos-app.sh "dist/$PKG"
          ditto -c -k --keepParent "dist/$PKG" "dist/$PKG.zip"

      - name: Build
        if: runner.os != 'macOS'
        run: cargo build --release --locked --target ${{ matrix.target }} -p itmo-labels -p itmo-labels-cli

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p "dist/$PKG"
          cp target/${{ matrix.target }}/release/{itmo-labels,labelprobe} "dist/$PKG/"
          tar -C dist -czf "dist/$PKG.tar.gz" "$PKG"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "dist/$env:PKG" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/itmo-labels.exe", "target/${{ matrix.target }}/release/labelprobe.exe" "dist/$env:PKG/"
          Compress-Archive -Path "dist/$env:PKG" -DestinationPath "dist/$env:PKG.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG }}
          path: |
            dist/${{ env.PKG }}.zip
            dist/${{ env.PKG }}.tar.gz
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
